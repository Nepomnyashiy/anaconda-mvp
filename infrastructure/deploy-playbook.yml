---
- name: Deploy Anaconda MVP
  hosts: production
  gather_facts: yes
  vars:
    project_dir: /home/{{ deploy_user | default('root') }}/kip-service/anaconda_mvp
    deploy_user: "{{ deploy_user | default('root') }}"

  tasks:
    - name: Clone or update repository from GitHub
      git:
        repo: https://github.com/Nepomnyashiy/anaconda-mvp.git
        dest: "{{ project_dir }}"
        version: main
        force: yes
      register: git_result
      tags:
        - git
        - always

    - name: Show Git status
      debug:
        msg: "✅ Repository updated: {{ git_result.changed }}"

    - name: Configure .env file
      copy:
        src: "{{ project_dir }}/env.example"
        dest: "{{ project_dir }}/.env"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0600'
        force: no
        remote_src: yes

    - name: Build Docker images
      shell: cd {{ project_dir }} && docker compose build --no-cache
      register: build_result
      tags:
        - build
        - docker

    - name: Stop old containers
      shell: cd {{ project_dir }} && docker compose down
      ignore_errors: yes
      tags:
        - deploy
        - docker

    - name: Start new containers
      shell: cd {{ project_dir }} && docker compose up -d
      register: compose_result
      tags:
        - deploy
        - docker

    - name: Wait for API to be ready (10 retries)
      shell: curl -f http://localhost:8000/health || exit 1
      retries: 10
      delay: 5
      register: health_check
      until: health_check.rc == 0
      ignore_errors: yes
      tags:
        - health
        - monitor

    - name: Show container status
      shell: docker compose -f {{ project_dir }}/docker-compose.yml ps
      register: container_status
      changed_when: false

    - name: Display deployment success
      debug:
        msg:
          - "=========================================="
          - "✅ DEPLOYMENT SUCCESSFUL"
          - "=========================================="
          - "Project: {{ project_dir }}"
          - "Hostname: {{ inventory_hostname }}"
          - "Environment: production"
          - ""
          - "Container Status:"
          - "{{ container_status.stdout_lines }}"
          - ""
          - "Services:"
          - "  API: http://{{ inventory_hostname }}:8000"
          - "  Health: http://{{ inventory_hostname }}:8000/health"
          - ""
          - "Commands:"
          - "  ssh root@{{ inventory_hostname }} 'cd {{ project_dir }} && docker-compose logs -f'"
          - "  ssh root@{{ inventory_hostname }} 'cd {{ project_dir }} && docker-compose ps'"
          - "=========================================="
      tags:
        - post
        - always
