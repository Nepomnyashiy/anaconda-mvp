---
# Production host variables. Secret values must come from Ansible Vault.

ansible_user: root
ansible_port: 22

project_dir: /opt/anaconda_mvp
git_repo: git@github.com:Nepomnyashiy/anaconda-mvp.git
git_branch: main

email_imap_host: imap.yandex.ru
email_imap_port: 993
email_imap_user: "{{ vault_email_imap_user }}"
email_imap_password: "{{ vault_email_imap_password }}"

telegram_bot_token: "{{ vault_telegram_bot_token }}"
telegram_bot_username: "{{ vault_telegram_bot_username }}"
telegram_webhook_url: "{{ vault_telegram_webhook_url }}"

postgres_password: "{{ vault_postgres_password }}"

debug_mode: false
